name: Unzip and Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and find gradlew
        run: |
          unzip -o NightShield.zip
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            DIR=$(dirname "$GRADLE_PATH")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "错误：压缩包内未找到 gradlew 编译脚本！"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
